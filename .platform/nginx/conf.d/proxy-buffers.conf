# Supabase sets large session cookies on OAuth completion. The default
# nginx proxy_buffer_size (4k-8k) overflows when Next.js redirects back
# from /auth/callback with multiple Set-Cookie headers, causing 502
# "upstream sent too big header" errors. Bump the buffers so the full
# response (status line + Set-Cookie headers) fits.
proxy_buffer_size       16k;
proxy_buffers           8 16k;
proxy_busy_buffers_size 32k;
large_client_header_buffers 8 32k;
