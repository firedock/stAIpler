<title>stAIpler — How an Instruction Bundle Gets Built</title>
<style>

<script type="module">
import * as THREE from 'three';

// ============================================================
// DATA MODEL
// ============================================================

const ASSETS = [
  { id: 'identity',    title: 'core/identity.md',    kind: 'identity',    origin: 'library',  priority: 50, compat: 'anthropic, openai', inheritedFrom: 'base_identity' },
  { id: 'safety',      title: 'core/safety.md',      kind: 'constraints', origin: 'library',  priority: 40, compat: 'anthropic, openai' },
  { id: 'context',     title: 'support/context.md',  kind: 'context',     origin: 'library',  priority: 30, compat: 'anthropic, openai', mergeStrategy: 'concatenate' },
  { id: 'skills',      title: './skills.md',          kind: 'skills',      origin: 'local',    priority: 60, compat: 'anthropic, openai', mergeStrategy: 'concatenate' },
  { id: 'style',       title: 'support/style.md',    kind: 'style',       origin: 'library',  priority: 35, compat: 'anthropic, openai', mergeStrategy: 'last-wins', discarded: true },
  { id: 'style-local', title: './style.md',           kind: 'style',       origin: 'local',    priority: 65, compat: 'anthropic, openai', mergeStrategy: 'last-wins' },
  { id: 'skill-ext',   title: 'external/SKILL.md',   kind: 'skills',      origin: 'imported', priority: 20, compat: 'copilot',           filtered: true, targetCompatible: false },
  { id: 'memory',      title: 'memory.md',           kind: 'memory',      origin: 'local',    priority: 70, compat: 'anthropic, openai', runtimeInjectable: true },
];

const CANONICAL_ORDER = ['identity', 'context', 'constraints', 'skills', 'style', 'memory'];

const KIND_COLORS = {
  identity:    0x60a5fa,
  constraints: 0xf87171,
  context:     0xfbbf24,
  skills:      0xa78bfa,
  style:       0xf0abfc,
  memory:      0x34d399,
};

// ============================================================
// TIMELINE — 12 second cycle
// ============================================================

const CYCLE = 12;
const PHASES = [
  { id: 'idle',       start: 0.0,  end: 1.0,  caption: '' },
  { id: 'discover',   start: 1.0,  end: 2.5,  caption: 'discover assets' },
  { id: 'validate',   start: 2.5,  end: 3.7,  caption: 'validate contracts' },
  { id: 'filter',     start: 3.7,  end: 5.0,  caption: 'filter by target' },
  { id: 'inherit',    start: 5.0,  end: 6.0,  caption: 'inherit' },
  { id: 'lastWins',   start: 6.0,  end: 7.0,  caption: 'last-wins' },
  { id: 'concat',     start: 7.0,  end: 8.2,  caption: 'concatenate' },
  { id: 'order',      start: 8.2,  end: 9.3,  caption: 'order sections' },
  { id: 'staple',     start: 9.3,  end: 10.8, caption: 'compile bundle' },
  { id: 'runtime',    start: 10.8, end: 11.5, caption: 'runtime injection' },
  { id: 'reveal',     start: 11.5, end: 12.0, caption: '' },
];

// ============================================================
// THREE.JS SETUP
// ============================================================

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08090e);
scene.fog = new THREE.FogExp2(0x08090e, 0.018);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(-14, 4, 12);
camera.lookAt(0, 0, 0);

// ---- Lights ----
scene.add(new THREE.AmbientLight(0x667799, 0.35));

const keyLight = new THREE.DirectionalLight(0xdde4ff, 0.8);
keyLight.position.set(8, 12, 10);
scene.add(keyLight);

const fillLight = new THREE.PointLight(0x7eb8ff, 0.5, 40);
fillLight.position.set(-10, 3, 5);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0xf0abfc, 0.3, 40);
rimLight.position.set(10, -2, -5);
scene.add(rimLight);

// ---- Background ----
const groundGeo = new THREE.PlaneGeometry(80, 80);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x0c0d14, roughness: 0.95, metalness: 0.0 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -3.5;
scene.add(ground);

const gridHelper = new THREE.GridHelper(60, 60, 0x1a1b28, 0x12131e);
gridHelper.position.y = -3.49;
scene.add(gridHelper);

// Particles
const particleCount = 400;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(particleCount * 3);
for (let i = 0; i < particleCount; i++) {
  pPos[i * 3] = (Math.random() - 0.5) * 50;
  pPos[i * 3 + 1] = (Math.random() - 0.5) * 20;
  pPos[i * 3 + 2] = (Math.random() - 0.5) * 50;
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const pMat = new THREE.PointsMaterial({
  color: 0x4455aa, size: 0.04, transparent: true, opacity: 0.4,
  sizeAttenuation: true, blending: THREE.AdditiveBlending, depthWrite: false,
});
const particles = new THREE.Points(pGeo, pMat);
scene.add(particles);

// ============================================================
// PIPELINE LAYOUT
// ============================================================

const PX = {
  inputStart: -16, input: -10, validate: -5, filter: -2,
  inherit: 1, merge: 4, order: 7, staple: 10, output: 13,
};

const LANE_Y = { library: 1.5, local: 0, imported: -1.5 };

// ---- Stage gate markers ----
function makeStageGate(x, label, color) {
  const group = new THREE.Group();
  group.position.set(x, 0, 0);

  const planeGeo = new THREE.PlaneGeometry(0.03, 6);
  const planeMat = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity: 0.0, side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  group.add(new THREE.Mesh(planeGeo, planeMat));

  const lineGeo = new THREE.PlaneGeometry(4, 0.02);
  const lineMat = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity: 0.0,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const line = new THREE.Mesh(lineGeo, lineMat);
  line.position.y = 3.2;
  group.add(line);

  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(180, 200, 255, 0.8)';
  ctx.font = '500 22px "JetBrains Mono", monospace';
  ctx.textAlign = 'center';
  ctx.fillText(label, 128, 40);
  const tex = new THREE.CanvasTexture(canvas);
  const spriteMat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.0, blending: THREE.AdditiveBlending });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.scale.set(3, 0.75, 1);
  sprite.position.y = 3.8;
  group.add(sprite);

  scene.add(group);
  return { group, planeMat, lineMat, spriteMat };
}

const gates = {
  validate: makeStageGate(PX.validate, 'validate', 0x60a5fa),
  filter:   makeStageGate(PX.filter, 'filter', 0xfbbf24),
  merge:    makeStageGate(PX.merge, 'merge', 0xa78bfa),
  order:    makeStageGate(PX.order, 'order', 0x34d399),
};

// ---- Lane labels ----
function makeLaneLabel(text, y) {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 48;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
  ctx.font = '300 18px "Inter", sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(text, 240, 32);
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.0 });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(3.5, 0.65, 1);
  sprite.position.set(PX.inputStart + 2, y, 0);
  scene.add(sprite);
  return { sprite, mat };
}

const laneLabels = [
  makeLaneLabel('library', LANE_Y.library),
  makeLaneLabel('local', LANE_Y.local),
  makeLaneLabel('imported', LANE_Y.imported),
];

// ============================================================
// CARD TEXTURES
// ============================================================

function makeCardTexture(asset) {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 320;
  const ctx = canvas.getContext('2d');
  const c = KIND_COLORS[asset.kind] || 0x888888;
  const r = (c >> 16) & 0xff, g = (c >> 8) & 0xff, b = c & 0xff;

  // Glass background
  ctx.fillStyle = `rgba(${r}, ${g}, ${b}, 0.06)`;
  ctx.fillRect(0, 0, 512, 320);

  // Border
  ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, 0.35)`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(4, 4, 504, 312, 12);
  ctx.stroke();

  // Title
  ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
  ctx.font = '600 26px "Inter", system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(asset.title, 24, 42);

  // Kind badge
  ctx.fillStyle = `rgba(${r}, ${g}, ${b}, 0.2)`;
  const kindW = ctx.measureText(asset.kind).width + 20;
  ctx.beginPath(); ctx.roundRect(24, 56, kindW, 28, 6); ctx.fill();
  ctx.fillStyle = `rgba(${r}, ${g}, ${b}, 0.8)`;
  ctx.font = '500 16px "JetBrains Mono", monospace';
  ctx.fillText(asset.kind, 34, 76);

  // Priority badge
  ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
  const priText = `p:${asset.priority}`;
  const priW = ctx.measureText(priText).width + 20;
  ctx.beginPath(); ctx.roundRect(24 + kindW + 10, 56, priW, 28, 6); ctx.fill();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
  ctx.fillText(priText, 34 + kindW + 10, 76);

  // Source + compat
  ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
  ctx.font = '400 14px "Inter", sans-serif';
  ctx.fillText(`source: ${asset.origin}`, 24, 110);
  if (asset.compat) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
    ctx.fillText(`compat: ${asset.compat}`, 24, 130);
  }

  // Fake markdown lines
  ctx.fillStyle = `rgba(${r}, ${g}, ${b}, 0.06)`;
  for (let i = 0; i < 6; i++) {
    ctx.fillRect(24, 155 + i * 22, 180 + Math.random() * 260, 8);
  }

  // Imported badge
  if (asset.origin === 'imported') {
    ctx.fillStyle = `rgba(${r}, ${g}, ${b}, 0.15)`;
    ctx.beginPath(); ctx.roundRect(380, 8, 120, 30, 6); ctx.fill();
    ctx.fillStyle = `rgba(${r}, ${g}, ${b}, 0.7)`;
    ctx.font = '500 14px "JetBrains Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('imported', 440, 28);
  }

  const tex = new THREE.CanvasTexture(canvas);
  tex.needsUpdate = true;
  return tex;
}

// ============================================================
// CARD OBJECTS
// ============================================================

class Card {
  constructor(asset, index) {
    this.asset = asset;
    this.index = index;
    this.color = new THREE.Color(KIND_COLORS[asset.kind] || 0x888888);

    const geo = new THREE.BoxGeometry(3.0, 1.9, 0.04);
    const tex = makeCardTexture(asset);
    this.mat = new THREE.MeshPhysicalMaterial({
      map: tex, color: 0xffffff, metalness: 0.05, roughness: 0.35,
      transparent: true, opacity: 0.0,
      emissive: this.color, emissiveIntensity: 0.03,
      side: THREE.DoubleSide, clearcoat: 0.3, clearcoatRoughness: 0.4,
    });
    this.mesh = new THREE.Mesh(geo, this.mat);

    const edgeGeo = new THREE.EdgesGeometry(geo);
    this.edgeMat = new THREE.LineBasicMaterial({
      color: KIND_COLORS[asset.kind], transparent: true, opacity: 0.0,
    });
    this.edges = new THREE.LineSegments(edgeGeo, this.edgeMat);
    this.mesh.add(this.edges);

    const laneY = LANE_Y[asset.origin] || 0;
    const stagger = index * 0.7;
    this.offscreenPos = new THREE.Vector3(PX.inputStart - stagger, laneY, (Math.random() - 0.5) * 2);
    this.inputPos = new THREE.Vector3(PX.input + index * 0.4, laneY, 0);

    this.mesh.position.copy(this.offscreenPos);
    scene.add(this.mesh);

    this.targetPos = this.offscreenPos.clone();
    this.targetOpacity = 0;
    this.targetEdgeOpacity = 0;
    this.targetEmissive = 0.03;
    this.scanFlash = 0;
    this.grayscale = 0;
    this.currentOpacity = 0;
    this.currentEdgeOpacity = 0;
    this.currentEmissive = 0.03;
  }

  update(dt) {
    const speed = 3.5;
    const decay = 1 - Math.exp(-speed * dt);
    this.mesh.position.lerp(this.targetPos, decay);
    this.currentOpacity += (this.targetOpacity - this.currentOpacity) * decay;
    this.currentEdgeOpacity += (this.targetEdgeOpacity - this.currentEdgeOpacity) * decay;
    this.currentEmissive += (this.targetEmissive - this.currentEmissive) * decay;

    this.mat.opacity = this.currentOpacity;
    this.edgeMat.opacity = this.currentEdgeOpacity;
    this.mat.emissiveIntensity = this.currentEmissive + this.scanFlash;
    this.scanFlash *= 0.9;

    if (this.grayscale > 0) {
      const g = 0.35;
      this.mat.color.setRGB(1 - this.grayscale * (1 - g), 1 - this.grayscale * (1 - g), 1 - this.grayscale * (1 - g));
      this.mat.emissive.setRGB(g, g, g);
    } else {
      this.mat.color.setRGB(1, 1, 1);
      this.mat.emissive.copy(this.color);
    }
  }
}

const cards = ASSETS.map((a, i) => new Card(a, i));

// ============================================================
// GHOST CARD (inheritance parent)
// ============================================================

const ghostAsset = { id: 'base_identity', title: 'base_identity.md', kind: 'identity', origin: 'library', priority: 30, compat: '' };
const ghostTex = makeCardTexture(ghostAsset);
const ghostMat = new THREE.MeshPhysicalMaterial({
  map: ghostTex, color: 0xffffff, metalness: 0.05, roughness: 0.35,
  transparent: true, opacity: 0.0, emissive: new THREE.Color(KIND_COLORS.identity),
  emissiveIntensity: 0.05, side: THREE.DoubleSide,
});
const ghostMesh = new THREE.Mesh(new THREE.BoxGeometry(3.0, 1.9, 0.04), ghostMat);
ghostMesh.position.set(PX.inherit - 1, LANE_Y.library + 1.2, -0.5);
scene.add(ghostMesh);

// ============================================================
// FILTER SIDE RAIL
// ============================================================

const sideRailPos = new THREE.Vector3(PX.filter + 1, -3.2, 1);

function makeTagSprite(text, color) {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 48;
  const ctx = c.getContext('2d');
  ctx.fillStyle = color;
  ctx.font = '500 20px "JetBrains Mono", monospace';
  ctx.textAlign = 'center';
  ctx.fillText(text, 64, 32);
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.0 });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(1.8, 0.7, 1);
  return { sprite, mat };
}

const filteredTag = makeTagSprite('filtered', 'rgba(251, 191, 36, 0.6)');
filteredTag.sprite.position.copy(sideRailPos).add(new THREE.Vector3(0, -1.2, 0));
scene.add(filteredTag.sprite);

// Target badge
const targetCanvas = document.createElement('canvas');
targetCanvas.width = 320; targetCanvas.height = 48;
const tbCtx = targetCanvas.getContext('2d');
tbCtx.fillStyle = 'rgba(167, 139, 250, 0.7)';
tbCtx.font = '500 20px "JetBrains Mono", monospace';
tbCtx.textAlign = 'center';
tbCtx.fillText('target: anthropic \u00b7 api', 160, 32);
const targetTex = new THREE.CanvasTexture(targetCanvas);
const targetBadgeMat = new THREE.SpriteMaterial({ map: targetTex, transparent: true, opacity: 0.0 });
const targetBadge = new THREE.Sprite(targetBadgeMat);
targetBadge.scale.set(5, 0.75, 1);
targetBadge.position.set(PX.filter, 3.5, 0);
scene.add(targetBadge);

// Discard label
const discardTag = makeTagSprite('discarded', 'rgba(255, 255, 255, 0.25)');
discardTag.sprite.position.set(PX.merge, -3.5, 0);
scene.add(discardTag.sprite);

// ============================================================
// BUNDLE
// ============================================================

const bundleGroup = new THREE.Group();
bundleGroup.position.set(PX.output, 0, 0);

const bundleMat = new THREE.MeshPhysicalMaterial({
  color: 0x1e1e2e, metalness: 0.15, roughness: 0.3,
  transparent: true, opacity: 0.0,
  emissive: new THREE.Color(0x6644cc), emissiveIntensity: 0.15,
  clearcoat: 0.5, clearcoatRoughness: 0.3,
});
const bundleMesh = new THREE.Mesh(new THREE.BoxGeometry(2.8, 3.6, 0.45), bundleMat);
bundleGroup.add(bundleMesh);

const bundleEdgeMat = new THREE.LineBasicMaterial({ color: 0xa78bfa, transparent: true, opacity: 0.0 });
bundleMesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(2.8, 3.6, 0.45)), bundleEdgeMat));

// Section tabs
const tabKinds = ['identity', 'context', 'constraints', 'skills', 'style', 'memory'];
const tabs = [];
tabKinds.forEach((kind, i) => {
  const tabColor = KIND_COLORS[kind] || 0x888888;
  const tabMat = new THREE.MeshPhysicalMaterial({
    color: tabColor, metalness: 0.1, roughness: 0.4,
    transparent: true, opacity: 0.0,
    emissive: new THREE.Color(tabColor), emissiveIntensity: 0.2,
  });
  const tabMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.45, 0.08), tabMat);
  tabMesh.position.set(1.65, 1.4 - i * 0.55, 0);
  bundleGroup.add(tabMesh);

  const tc = document.createElement('canvas');
  tc.width = 128; tc.height = 32;
  const tctx = tc.getContext('2d');
  tctx.fillStyle = '#ffffff';
  tctx.font = '500 16px "JetBrains Mono", monospace';
  tctx.textAlign = 'left';
  tctx.fillText(kind, 4, 22);
  const labelMat = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(tc), transparent: true, opacity: 0.0 });
  const label = new THREE.Sprite(labelMat);
  label.scale.set(1.5, 0.38, 1);
  label.position.set(2.8, 1.4 - i * 0.55, 0);
  bundleGroup.add(label);

  tabs.push({ mesh: tabMesh, mat: tabMat, labelMat, kind });
});

// "Compiled Bundle" label
const cbCanvas = document.createElement('canvas');
cbCanvas.width = 320; cbCanvas.height = 64;
const cbCtx = cbCanvas.getContext('2d');
cbCtx.fillStyle = 'rgba(255,255,255,0.85)';
cbCtx.font = '600 28px "Inter", sans-serif';
cbCtx.textAlign = 'center';
cbCtx.fillText('Compiled Bundle', 160, 42);
const cbMat = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cbCanvas), transparent: true, opacity: 0.0 });
const cbLabel = new THREE.Sprite(cbMat);
cbLabel.scale.set(4.5, 0.9, 1);
cbLabel.position.set(0, 2.5, 0);
bundleGroup.add(cbLabel);

scene.add(bundleGroup);

// ============================================================
// RUNTIME INJECTION
// ============================================================

const runtimeChips = [];
for (let i = 0; i < 3; i++) {
  const chipMat = new THREE.MeshPhysicalMaterial({
    color: 0x34d399, metalness: 0.1, roughness: 0.4,
    transparent: true, opacity: 0.0,
    emissive: new THREE.Color(0x34d399), emissiveIntensity: 0.3,
  });
  const chip = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.3, 0.03), chipMat);
  chip.position.set(PX.output + 5 - i * 1.2, -1.5, 0.5);
  scene.add(chip);
  runtimeChips.push({ mesh: chip, mat: chipMat, startX: PX.output + 5 - i * 1.2 });
}

const rtTag = makeTagSprite('runtime', 'rgba(52, 211, 153, 0.6)');
rtTag.sprite.position.set(PX.output + 4, -2.2, 0.5);
scene.add(rtTag.sprite);

// Chip labels
const chipLabels = ['user state', 'session ctx', 'preferences'];
const chipLabelSprites = [];
chipLabels.forEach((text, i) => {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 32;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(52, 211, 153, 0.5)';
  ctx.font = '400 14px "JetBrains Mono", monospace';
  ctx.textAlign = 'center';
  ctx.fillText(text, 64, 22);
  const mat = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, opacity: 0.0 });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(1.2, 0.3, 1);
  sprite.position.set(PX.output + 5 - i * 1.2, -1.9, 0.5);
  scene.add(sprite);
  chipLabelSprites.push({ sprite, mat });
});

// ============================================================
// SPINE BINDING
// ============================================================

const spineMat = new THREE.MeshPhysicalMaterial({
  color: 0xa78bfa, metalness: 0.6, roughness: 0.2,
  transparent: true, opacity: 0.0,
  emissive: new THREE.Color(0xa78bfa), emissiveIntensity: 0.4,
});
const spineMesh = new THREE.Mesh(new THREE.BoxGeometry(0.08, 3.6, 0.5), spineMat);
spineMesh.position.set(PX.output - 1.4, 0, 0);
scene.add(spineMesh);

// ============================================================
// HELPERS
// ============================================================

function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }
function easeOutQuart(t) { return 1 - Math.pow(1-t,4); }
function clamp01(t) { return Math.max(0, Math.min(1, t)); }
function lerp(a, b, t) { return a + (b - a) * t; }

// ============================================================
// UI
// ============================================================

const progressFill = document.getElementById('progress-fill');
const phaseCaption = document.getElementById('phase-caption');

function updateUI(cycleT, phase) {
  progressFill.style.width = (cycleT / CYCLE * 100) + '%';
  if (phase.caption) {
    phaseCaption.textContent = phase.caption;
    phaseCaption.classList.add('visible');
  } else {
    phaseCaption.classList.remove('visible');
  }
}

// ============================================================
// MAIN LOOP
// ============================================================

const clock = new THREE.Clock();
let elapsed = 0;

function getPhase(t) {
  for (let i = PHASES.length - 1; i >= 0; i--) {
    if (t >= PHASES[i].start) return PHASES[i];
  }
  return PHASES[0];
}

// Track last known good positions for cards between phases
const cardLastPos = ASSETS.map(() => new THREE.Vector3());

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  elapsed += dt;
  const cycleT = elapsed % CYCLE;
  const phase = getPhase(cycleT);
  const phaseT = clamp01((cycleT - phase.start) / (phase.end - phase.start));

  updateUI(cycleT, phase);

  // ---- CAMERA: slow dolly left to right ----
  const progress = clamp01(cycleT / CYCLE);
  const camX = lerp(-12, 14, easeInOutCubic(progress));
  const camY = 3.5 + Math.sin(cycleT * 0.5) * 0.3;
  const camZ = 10 + Math.sin(cycleT * 0.3) * 1;
  camera.position.set(camX, camY, camZ);
  camera.lookAt(lerp(-8, 12, easeInOutCubic(progress)), 0, 0);

  // ---- GATE VISIBILITY ----
  for (const [name, gate] of Object.entries(gates)) {
    const ps = PHASES.find(p => p.id === name)?.start || 3;
    const fadeIn = clamp01((cycleT - ps + 1.5) / 2);
    const fadeOut = clamp01((CYCLE - 0.5 - cycleT) / 1.0);
    const op = Math.min(fadeIn, fadeOut);
    gate.planeMat.opacity = op * 0.2;
    gate.lineMat.opacity = op * 0.3;
    gate.spriteMat.opacity = op * 0.5;
  }

  // ---- LANE LABELS ----
  const laneLabelOp = clamp01((cycleT - 0.5) / 1.0) * clamp01((5 - cycleT) / 1.5);
  laneLabels.forEach(l => l.mat.opacity = Math.max(0, laneLabelOp * 0.6));

  // ============================================================
  // PHASE LOGIC
  // ============================================================

  if (phase.id === 'idle') {
    cards.forEach(card => {
      card.targetPos.copy(card.offscreenPos);
      card.targetOpacity = 0;
      card.targetEdgeOpacity = 0;
      card.targetEmissive = 0.03;
      card.grayscale = 0;
      card.mesh.rotation.set(0, 0, 0);
      card.mesh.scale.set(1, 1, 1);
    });
    ghostMat.opacity = 0;
    bundleMat.opacity = 0; bundleEdgeMat.opacity = 0; cbMat.opacity = 0;
    spineMat.opacity = 0;
    tabs.forEach(t => { t.mat.opacity = 0; t.labelMat.opacity = 0; });
    runtimeChips.forEach(c => { c.mat.opacity = 0; c.mesh.position.x = c.startX; });
    chipLabelSprites.forEach(c => c.mat.opacity = 0);
    rtTag.mat.opacity = 0;
    filteredTag.mat.opacity = 0; targetBadgeMat.opacity = 0; discardTag.mat.opacity = 0;
  }

  if (phase.id === 'discover') {
    const stagger = 0.1;
    cards.forEach((card, i) => {
      const cardT = clamp01((phaseT - i * stagger) / (1 - ASSETS.length * stagger));
      const e = easeOutQuart(cardT);
      card.targetPos.lerpVectors(card.offscreenPos, card.inputPos, e);
      card.targetOpacity = e * 0.9;
      card.targetEdgeOpacity = e * 0.5;
      card.targetPos.y = card.inputPos.y + Math.sin(elapsed * 0.8 + i) * 0.05 * e;
      card.targetEmissive = card.asset.origin === 'imported' && cardT > 0 && cardT < 0.5 ? 0.15 : 0.03;
    });
  }

  if (phase.id === 'validate') {
    const scanProgress = easeInOutCubic(phaseT);
    const scanX = lerp(PX.input - 2, PX.validate + 3, scanProgress);

    cards.forEach((card, i) => {
      const moveT = easeInOutCubic(clamp01(phaseT * 1.5));
      card.targetPos.x = lerp(card.inputPos.x, PX.validate + 1 + i * 0.4, moveT);
      card.targetPos.y = card.inputPos.y + Math.sin(elapsed * 0.8 + i) * 0.04;
      card.targetOpacity = 0.9;
      card.targetEdgeOpacity = 0.5;

      if (Math.abs(card.mesh.position.x - scanX) < 1.5) {
        card.scanFlash = 0.25;
        card.targetEdgeOpacity = 0.9;
      }
    });
    gates.validate.planeMat.opacity = 0.3 + Math.sin(phaseT * Math.PI) * 0.4;
  }

  if (phase.id === 'filter') {
    targetBadgeMat.opacity = easeOutQuart(clamp01(phaseT * 3)) * 0.8;

    cards.forEach((card, i) => {
      const moveT = easeInOutCubic(clamp01(phaseT * 1.2));
      if (card.asset.filtered) {
        const filterT = easeInOutCubic(clamp01((phaseT - 0.3) / 0.5));
        card.targetPos.x = lerp(card.mesh.position.x, sideRailPos.x, filterT);
        card.targetPos.y = lerp(card.mesh.position.y, sideRailPos.y, filterT);
        card.targetPos.z = lerp(0, sideRailPos.z, filterT);
        card.targetOpacity = lerp(0.9, 0.2, filterT);
        card.targetEdgeOpacity = lerp(0.5, 0.1, filterT);
        card.grayscale = filterT;
        filteredTag.mat.opacity = filterT * 0.7;
      } else {
        card.targetPos.x = lerp(card.mesh.position.x, PX.filter + 1.5 + i * 0.4, moveT);
        card.targetPos.y = LANE_Y[card.asset.origin] + Math.sin(elapsed * 0.8 + i) * 0.04;
      }
    });
    gates.filter.planeMat.opacity = 0.3 + Math.sin(phaseT * Math.PI) * 0.3;
  }

  if (phase.id === 'inherit') {
    const identityCard = cards.find(c => c.asset.id === 'identity');
    const ghostAppear = easeOutQuart(clamp01(phaseT * 2.5));
    const ghostMerge = easeInOutCubic(clamp01((phaseT - 0.4) / 0.5));

    ghostMat.opacity = ghostAppear * 0.4 * (1 - ghostMerge);
    ghostMesh.position.set(
      lerp(identityCard.mesh.position.x - 1.5, identityCard.mesh.position.x, ghostMerge),
      lerp(identityCard.mesh.position.y + 1.0, identityCard.mesh.position.y, ghostMerge),
      lerp(-0.8, 0, ghostMerge)
    );

    if (ghostMerge > 0.8) {
      identityCard.mesh.scale.z = lerp(1, 2.5, clamp01((ghostMerge - 0.8) / 0.2));
      identityCard.targetEmissive = 0.12;
    }

    // Drift all active cards right slightly
    cards.forEach((card, i) => {
      if (card.asset.filtered) return;
      card.targetPos.x += 0.015;
    });
  }

  if (phase.id === 'lastWins') {
    const styleLib = cards.find(c => c.asset.id === 'style');
    const styleLocal = cards.find(c => c.asset.id === 'style-local');

    if (styleLib && styleLocal) {
      const alignT = easeInOutCubic(clamp01(phaseT * 2));
      const mergeX = PX.merge;

      styleLocal.targetPos.set(lerp(styleLocal.mesh.position.x, mergeX, alignT), lerp(styleLocal.mesh.position.y, 0, alignT), 0);
      styleLib.targetPos.set(lerp(styleLib.mesh.position.x, mergeX, alignT), lerp(styleLib.mesh.position.y, -0.1, alignT), -0.15);

      const resolveT = easeInOutCubic(clamp01((phaseT - 0.5) / 0.4));
      styleLocal.targetPos.x = lerp(mergeX, mergeX + 2, resolveT);
      styleLocal.targetEmissive = lerp(0.03, 0.15, resolveT * (1 - resolveT) * 4);

      styleLib.targetPos.y = lerp(-0.1, -3, resolveT);
      styleLib.targetOpacity = lerp(0.9, 0.15, resolveT);
      styleLib.targetEdgeOpacity = lerp(0.5, 0.05, resolveT);
      styleLib.grayscale = resolveT * 0.7;

      discardTag.mat.opacity = resolveT * 0.5;
    }

    // Keep other cards drifting
    cards.forEach(card => {
      if (card.asset.filtered || card.asset.discarded || card.asset.id === 'style-local') return;
      card.targetPos.x += 0.01;
    });

    gates.merge.planeMat.opacity = 0.4;
  }

  if (phase.id === 'concat') {
    const contextCard = cards.find(c => c.asset.id === 'context');
    const skillsCard = cards.find(c => c.asset.id === 'skills');
    const stackX = PX.merge + 2;

    if (contextCard && skillsCard) {
      const stackT = easeInOutCubic(clamp01(phaseT * 1.5));
      contextCard.targetPos.set(lerp(contextCard.mesh.position.x, stackX, stackT), lerp(contextCard.mesh.position.y, -0.5, stackT), 0);
      skillsCard.targetPos.set(lerp(skillsCard.mesh.position.x, stackX, stackT), lerp(skillsCard.mesh.position.y, 0.5, stackT), 0);

      const lockT = easeOutQuart(clamp01((phaseT - 0.5) / 0.4));
      contextCard.targetPos.z = lerp(0, 0.06, lockT);
      skillsCard.targetPos.z = lerp(0, -0.06, lockT);
      contextCard.targetEmissive = lerp(0.03, 0.08, lockT);
      skillsCard.targetEmissive = lerp(0.03, 0.08, lockT);
    }

    // Other active cards keep drifting
    cards.forEach(card => {
      if (card.asset.filtered || card.asset.discarded || card.asset.id === 'context' || card.asset.id === 'skills') return;
      card.targetPos.x += 0.008;
    });
  }

  if (phase.id === 'order') {
    const activeCards = cards.filter(c => !c.asset.filtered && !c.asset.discarded);
    const sorted = [...activeCards].sort((a, b) => {
      return CANONICAL_ORDER.indexOf(a.asset.kind) - CANONICAL_ORDER.indexOf(b.asset.kind);
    });

    const orderT = easeInOutCubic(phaseT);
    sorted.forEach((card, i) => {
      card.targetPos.set(
        lerp(card.mesh.position.x, PX.order, orderT),
        lerp(card.mesh.position.y, 1.8 - i * 0.7, orderT),
        lerp(card.mesh.position.z, 0, orderT)
      );
      card.mesh.rotation.y *= (1 - orderT * 0.3);
      card.mesh.rotation.x = 0;
      card.mesh.rotation.z = 0;
    });
  }

  if (phase.id === 'staple') {
    const activeCards = cards.filter(c => !c.asset.filtered && !c.asset.discarded);
    const sorted = [...activeCards].sort((a, b) => {
      return CANONICAL_ORDER.indexOf(a.asset.kind) - CANONICAL_ORDER.indexOf(b.asset.kind);
    });

    const compressT = easeInOutCubic(clamp01(phaseT * 1.2));
    const fadeT = easeInOutCubic(clamp01((phaseT - 0.4) / 0.4));

    sorted.forEach(card => {
      card.targetPos.set(lerp(card.mesh.position.x, PX.output, compressT), lerp(card.mesh.position.y, 0, compressT), 0);
      card.targetOpacity = lerp(card.currentOpacity, 0, fadeT);
      card.targetEdgeOpacity = lerp(card.currentEdgeOpacity, 0, fadeT);
      card.mesh.scale.x = lerp(1, 0.85, compressT);
      card.mesh.scale.y = lerp(1, 0.85, compressT);
    });

    // Hide filtered/discarded
    cards.filter(c => c.asset.filtered || c.asset.discarded).forEach(c => {
      c.targetOpacity = Math.max(0, c.currentOpacity - dt * 2);
      c.targetEdgeOpacity = 0;
    });
    filteredTag.mat.opacity = Math.max(0, filteredTag.mat.opacity - dt * 2);
    discardTag.mat.opacity = Math.max(0, discardTag.mat.opacity - dt * 2);
    targetBadgeMat.opacity = Math.max(0, targetBadgeMat.opacity - dt * 2);

    // Spine binding
    const spineT = easeOutQuart(clamp01((phaseT - 0.3) / 0.3));
    spineMat.opacity = spineT * 0.8;
    spineMesh.scale.y = spineT;
    spineMat.emissiveIntensity = (phaseT > 0.35 && phaseT < 0.55)
      ? 0.8 + Math.sin((phaseT - 0.35) / 0.2 * Math.PI) * 0.5
      : 0.4;

    // Bundle appears
    const bundleT = easeOutQuart(clamp01((phaseT - 0.5) / 0.4));
    bundleMat.opacity = bundleT * 0.85;
    bundleEdgeMat.opacity = bundleT * 0.6;
    cbMat.opacity = bundleT * 0.85;

    tabs.forEach((tab, i) => {
      const tabT = easeOutQuart(clamp01((phaseT - 0.55 - i * 0.04) / 0.25));
      tab.mat.opacity = tabT * 0.8;
      tab.labelMat.opacity = tabT * 0.7;
    });

    if (phaseT > 0.7) spineMat.opacity = lerp(0.8, 0, clamp01((phaseT - 0.7) / 0.3));
  }

  if (phase.id === 'runtime') {
    bundleMat.opacity = 0.85; bundleEdgeMat.opacity = 0.6; cbMat.opacity = 0.85;
    tabs.forEach(t => { t.mat.opacity = 0.8; t.labelMat.opacity = 0.7; });

    const memoryTab = tabs.find(t => t.kind === 'memory');
    if (memoryTab) {
      memoryTab.mat.emissiveIntensity = 0.3 + Math.sin(elapsed * 6) * 0.2;
      memoryTab.mat.opacity = 0.9 + Math.sin(elapsed * 6) * 0.1;
    }

    runtimeChips.forEach((chip, i) => {
      const ct = easeOutQuart(clamp01((phaseT - i * 0.15) / (1 - i * 0.15)));
      chip.mat.opacity = ct * 0.7;
      chip.mesh.position.x = lerp(chip.startX, PX.output + 2.2, ct * 0.6);
      chip.mesh.position.y = lerp(-1.5, -1.3 + i * 0.1, ct);
    });

    chipLabelSprites.forEach((c, i) => {
      c.mat.opacity = easeOutQuart(clamp01((phaseT - i * 0.15) / 0.6)) * 0.5;
      c.sprite.position.x = runtimeChips[i].mesh.position.x;
    });

    rtTag.mat.opacity = easeOutQuart(clamp01(phaseT * 2)) * 0.6;
    cards.forEach(c => { c.targetOpacity = 0; c.targetEdgeOpacity = 0; });
    spineMat.opacity = 0;
  }

  if (phase.id === 'reveal') {
    bundleMesh.rotation.y = lerp(0, 0.2, easeInOutCubic(phaseT));

    const fadeOut = easeInOutCubic(clamp01((phaseT - 0.3) / 0.7));
    bundleMat.opacity = lerp(0.85, 0, fadeOut);
    bundleEdgeMat.opacity = lerp(0.6, 0, fadeOut);
    cbMat.opacity = lerp(0.85, 0, fadeOut);
    tabs.forEach(t => { t.mat.opacity *= (1 - fadeOut * 0.05); t.labelMat.opacity *= (1 - fadeOut * 0.05); });
    tabs.forEach(t => { t.mat.opacity = lerp(0.8, 0, fadeOut); t.labelMat.opacity = lerp(0.7, 0, fadeOut); });
    runtimeChips.forEach(c => c.mat.opacity = lerp(0.7, 0, fadeOut));
    chipLabelSprites.forEach(c => c.mat.opacity = lerp(0.5, 0, fadeOut));
    rtTag.mat.opacity = lerp(0.6, 0, fadeOut);
    filteredTag.mat.opacity = 0; targetBadgeMat.opacity = 0; discardTag.mat.opacity = 0;
    cards.forEach(c => { c.targetOpacity = 0; c.targetEdgeOpacity = 0; });
    spineMat.opacity = 0; ghostMat.opacity = 0;
  }

  // ---- UPDATE CARDS ----
  cards.forEach(c => c.update(dt));

  // ---- PARTICLES ----
  const pArr = particles.geometry.attributes.position.array;
  for (let i = 0; i < particleCount; i++) {
    pArr[i * 3 + 1] += Math.sin(elapsed * 0.2 + i * 0.7) * 0.001;
  }
  particles.geometry.attributes.position.needsUpdate = true;
  particles.rotation.y = elapsed * 0.005;

  // ---- BUNDLE IDLE ROTATION ----
  if (phase.id !== 'reveal' && phase.id !== 'staple') {
    bundleMesh.rotation.y = Math.sin(elapsed * 0.3) * 0.05;
    bundleMesh.rotation.x = Math.sin(elapsed * 0.2) * 0.02;
  }

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
